name: security

# Supply-chain (SCA) gate: fail the build if a dependency has a known
# vulnerability in the OSV.dev database. Runs on every push/PR and weekly,
# so newly-disclosed CVEs against pinned deps surface even without a code change.
#
# We install the OSV-Scanner binary directly (rather than the marketplace
# action) so the pipeline has no external action-version coupling. All commands
# use static literals — no untrusted event input is interpolated, so this
# workflow is not injectable.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OSV_VERSION: v2.4.0
  # From osv-scanner_SHA256SUMS of the OSV_VERSION release; update together.
  OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0

jobs:
  osv-scan:
    name: OSV dependency scan
    runs-on: [self-hosted, linux, x64, pve-ci]
    steps:
      - uses: actions/checkout@v4

      # pyproject declares version ranges; OSV needs concrete resolved
      # versions, so freeze the installed tree into a lockfile first.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fresh per-job venv: the persistent runner's global Python may hold
      # stale packages that would otherwise leak into the frozen lockfile.
      - name: Freeze resolved dependencies to a lockfile
        run: |
          venv_dir="$(mktemp -d "${RUNNER_TEMP}/venv.XXXXXX")"
          python -m venv "${venv_dir}"
          "${venv_dir}/bin/python" -m pip install --upgrade pip
          "${venv_dir}/bin/python" -m pip install -e ".[dev]"
          "${venv_dir}/bin/python" -m pip freeze > requirements.lock.txt
          echo "----- resolved dependency lock -----"
          cat requirements.lock.txt

      - name: Install OSV-Scanner
        run: |
          install_dir="$(mktemp -d "${RUNNER_TEMP}/osv-scanner.XXXXXX")"
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o "${install_dir}/osv-scanner"
          echo "${OSV_SHA256}  ${install_dir}/osv-scanner" | sha256sum -c -
          chmod +x "${install_dir}/osv-scanner"
          version_output="$("${install_dir}/osv-scanner" --version)"
          echo "${version_output}"
          echo "${version_output}" | grep -Fx "osv-scanner version: ${OSV_VERSION#v}" >/dev/null
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run OSV-Scanner (gate)
        run: osv-scanner scan source --lockfile=requirements.lock.txt
