name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test CLI
        run: |
          siem-detect tests/fixtures/nginx_attack.log -o json | python -c "import sys,json; d=json.load(sys.stdin); assert d['verdict']=='critical', d['verdict']; print('CLI OK:', d['verdict'])"
