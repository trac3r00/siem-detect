[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-detect"
version = "0.1.0"
description = "A dependency-light Sigma detection engine: run Sigma rules over logs and get MITRE ATT&CK-mapped detections."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "trac3r00" }]
keywords = ["sigma", "siem", "detection-engineering", "soc", "dfir", "mitre-attack", "threat-hunting", "log-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
siem-detect = "siem_detect.cli:main"

[project.urls]
Repository = "https://github.com/trac3r00/siem-detect"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siem_detect = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
