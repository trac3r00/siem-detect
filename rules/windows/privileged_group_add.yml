title: Windows Account Added To Privileged Group
id: 1a1b0c10-0022-4a10-9c03-win-group-add
status: experimental
description: >
  Detects a member being added to a security-enabled group (EventID 4728 global
  / 4732 local / 4756 universal). Used to spot persistence and privilege
  escalation via group membership.
references:
  - https://attack.mitre.org/techniques/T1098/
author: trac3r00
date: 2026/07/01
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4728
      - 4732
      - 4756
  condition: selection
falsepositives:
  - Routine IT administration adding users to groups
level: medium
