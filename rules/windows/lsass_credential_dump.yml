title: Windows LSASS Credential Dump Access
id: 1a1b0c10-0021-4a10-9c02-win-lsass
status: experimental
description: >
  Detects process access to lsass.exe or command lines invoking known
  credential-dumping tooling (mimikatz, comsvcs MiniDump, procdump on lsass).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: trac3r00
date: 2026/07/01
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
detection:
  selection_cmd:
    CommandLine|contains:
      - "sekurlsa::logonpasswords"
      - "mimikatz"
      - "comsvcs.dll, minidump"
      - "comsvcs.dll MiniDump"
      - "procdump -ma lsass"
      - "procdump.exe -ma lsass"
      - "-ma lsass.exe"
      - "lsass.dmp"
  selection_target:
    TargetImage|endswith: "\\lsass.exe"
  condition: 1 of selection_*
falsepositives:
  - EDR / AV products legitimately reading lsass memory
level: critical
