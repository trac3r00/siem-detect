title: Web Path Traversal / Local File Inclusion Attempt
id: 1a1b0c10-0011-4a10-9b02-web-traversal
status: experimental
description: >
  Detects directory traversal and LFI probes in the request URI, including
  encoded ../ sequences and access to sensitive system files.
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://owasp.org/www-community/attacks/Path_Traversal
author: trac3r00
date: 2026/07/01
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    uri|contains:
      - "../../"
      - "..%2f"
      - "%2e%2e%2f"
      - "..%5c"
      - "/etc/passwd"
      - "/etc/shadow"
      - "boot.ini"
      - "win.ini"
      - "php://filter"
  condition: selection
falsepositives:
  - Misconfigured clients requesting relative paths
level: high
