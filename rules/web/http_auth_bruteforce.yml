title: Web Server High Rate Of 401/403 Auth Failures
id: 1a1b0c10-0013-4a10-9b04-web-auth-fail
status: experimental
description: >
  Flags individual web requests returning 401/403 to sensitive admin/login
  endpoints. A cluster from one source indicates credential stuffing or
  forced-browsing of protected areas.
references:
  - https://attack.mitre.org/techniques/T1110/004/
author: trac3r00
date: 2026/07/01
tags:
  - attack.credential_access
  - attack.t1110.004
logsource:
  category: webserver
detection:
  selection_status:
    status:
      - 401
      - 403
  selection_path:
    uri|contains:
      - "/admin"
      - "/login"
      - "/wp-login"
      - "/api/"
      - "/.git/"
      - "/manager/html"
  condition: selection_status and selection_path
falsepositives:
  - Users who forgot their password on a login page
level: medium
