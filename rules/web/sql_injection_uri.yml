title: Web SQL Injection Attempt In URI
id: 1a1b0c10-0010-4a10-9b01-web-sqli
status: experimental
description: >
  Detects classic SQL injection probe patterns in the request URI of a web
  access log (UNION SELECT, boolean tautologies, comment terminators, sleep()).
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://owasp.org/www-community/attacks/SQL_Injection
author: trac3r00
date: 2026/07/01
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    uri|contains:
      - "union+select"
      - "union%20select"
      - "' or '1'='1"
      - "%27+or+%271"
      - "or 1=1"
      - "sleep("
      - "benchmark("
      - "information_schema"
      - "--+-"
      - "'; drop table"
  condition: selection
falsepositives:
  - Security scanners run by the blue team
  - Legitimate search queries that happen to contain SQL keywords
level: high
