title: Linux Reverse Shell Command Pattern
id: 1a1b0c10-0003-4a10-9a03-linux-revshell
status: experimental
description: >
  Detects common interactive reverse-shell one-liners in command / message
  fields (bash /dev/tcp, nc -e, python pty spawn, mkfifo pipes).
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://gtfobins.github.io/
author: trac3r00
date: 2026/07/01
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  product: linux
detection:
  keywords:
    - "bash -i >& /dev/tcp/"
    - "/dev/tcp/"
    - "nc -e /bin"
    - "ncat -e /bin"
    - "mkfifo /tmp/"
    - "python -c 'import socket"
    - "pty.spawn"
    - "sh -i >& /dev/udp/"
  condition: keywords
falsepositives:
  - Security testing / red-team exercises
  - Documentation or training material stored in logs
level: high
