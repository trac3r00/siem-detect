title: AWS Root Account Console Usage
id: 1a1b0c10-0031-4a10-9d02-aws-root-login
status: experimental
description: >
  Detects console sign-in by the AWS account root user. Root should be locked
  away; any interactive root usage is high-signal and worth investigating.
references:
  - https://attack.mitre.org/techniques/T1078/004/
author: trac3r00
date: 2026/07/01
tags:
  - attack.privilege_escalation
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: ConsoleLogin
    userIdentity.type: Root
  condition: selection
falsepositives:
  - Break-glass root usage during an incident (should still be reviewed)
level: high
