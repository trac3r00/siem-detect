title: AWS IAM Access Key Created For Another User
id: 1a1b0c10-0032-4a10-9d03-aws-key-create
status: experimental
description: >
  Detects creation of a new IAM access key. When paired with a recently
  compromised identity this is a common persistence step (long-lived creds).
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: trac3r00
date: 2026/07/01
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: CreateAccessKey
  condition: selection
falsepositives:
  - Developers legitimately rotating their own access keys
level: medium
